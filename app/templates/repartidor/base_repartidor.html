<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title }}{% endblock %} - Repartidor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      background: #f5f5f5;
      color: #111;
    }

    /* ── BARRA SUPERIOR ── */
    .topbar {
      background: #1a6b3c;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar .topbar-title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .topbar .btn-salir {
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      display: inline-block;
    }
    .topbar .btn-salir:active { background: rgba(255,255,255,0.3); }

    /* ── MENSAJES FLASH ── */
    .mensajes { padding: 10px 16px 0; }
    .alerta {
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 1rem;
    }
    .alerta-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alerta-danger  { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alerta-warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .alerta-info    { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }

    /* ── CONTENIDO ── */
    .contenido {
      padding: 14px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

  <div class="topbar">
    <span class="topbar-title">&#x1F69A; Repartidor — {{ current_user.nombre }}</span>
    <a href="/auth/logout" class="btn-salir">Salir</a>
  </div>

  <!-- Mensajes flash -->
  <div class="mensajes">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alerta alerta-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <div class="contenido">
    {% block content %}{% endblock %}
  </div>

  {% block extra_js %}{% endblock %}
</body>
</html>
